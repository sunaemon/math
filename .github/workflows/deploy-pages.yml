# Build locally with tools/publish_pages_local.sh; Actions only verifies and deploys.
name: deploy-pages

on:
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: Release tag containing pages.tar.gz
        required: true
        type: string
      sha256:
        description: SHA-256 of pages.tar.gz
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'sunaemon/math'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download locally built site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_TAG: ${{ inputs.artifact_tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh release download "$ARTIFACT_TAG" --pattern pages.tar.gz --dir .
          printf '%s  pages.tar.gz\n' "$EXPECTED_SHA256" | sha256sum --check
          mkdir dist
          tar -xzf pages.tar.gz -C dist
          test -f dist/polish-space/index.html
          test -f dist/polish-space-ch1/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
